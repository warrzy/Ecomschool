# ECOM-SCHOOL — préproduction
# Fichier : /etc/nginx/sites-available/preprod.ecomschool.fr.conf
# Activation : sudo ln -s /etc/nginx/sites-available/preprod.ecomschool.fr.conf \
#              /etc/nginx/sites-enabled/
# Ne modifie aucune configuration existante (wendyam-finance.com, tme-machinery.com).

upstream ecomschool_preprod {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name preprod.ecomschool.fr;

    # /api/cron n'est appelé que localement (crontab du VPS) —
    # le secret Bearer reste néanmoins obligatoire.
    location /api/cron {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass         http://ecomschool_preprod;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Endpoints d'authentification : anti brute-force (zone ecom_auth,
    # définie dans /etc/nginx/conf.d/00-ecomschool-ratelimit.conf).
    location ^~ /api/auth/ {
        limit_req zone=ecom_auth burst=10 nodelay;
        proxy_pass         http://ecomschool_preprod;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Certbot réécrira ce bloc pour la redirection HTTPS.
    location / {
        # Protection d'accès à la préproduction — à activer par l'admin :
        #   sudo htpasswd -c /etc/nginx/.ecomschool_preprod_htpasswd recette
        #   puis décommenter les 2 lignes + nginx -t && systemctl reload nginx
        # auth_basic "ECOM-SCHOOL preproduction";
        # auth_basic_user_file /etc/nginx/.ecomschool_preprod_htpasswd;
        # Variante IP : allow <ip>; deny all; (avec satisfy any pour cumuler).

        limit_req zone=ecom_api burst=20 nodelay;
        limit_conn ecom_conn 30;
        proxy_pass         http://ecomschool_preprod;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;  # M7 : écrase toute chaîne forgée par le client
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        # En-têtes de sécurité de base (CSP laissée à l'application,
        # les pages Next nécessitent des scripts inline nonces).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # PDF collectifs et exports : réponses potentiellement lourdes.
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }
}
