# ECOM-SCHOOL — préproduction
# Fichier : /etc/nginx/sites-available/preprod.ecomschool.fr.conf
# Activation : sudo ln -s /etc/nginx/sites-available/preprod.ecomschool.fr.conf \
#              /etc/nginx/sites-enabled/
# Ne modifie aucune configuration existante (wendyam-finance.com, tme-machinery.com).

upstream ecomschool_preprod {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name preprod.ecomschool.fr;

    # /api/cron n'est appelé que localement (crontab du VPS) —
    # le secret Bearer reste néanmoins obligatoire.
    location /api/cron {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass         http://ecomschool_preprod;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Certbot réécrira ce bloc pour la redirection HTTPS.
    location / {
        proxy_pass         http://ecomschool_preprod;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        # PDF collectifs et exports : réponses potentiellement lourdes.
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }
}
