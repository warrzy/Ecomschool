# ECOM-SCHOOL — zones de limitation de débit (contexte HTTP).
#
# IMPORTANT : ce fichier doit être installé dans /etc/nginx/conf.d/
# (ou tout répertoire inclus par le bloc `http {}` de nginx.conf) —
# `limit_req_zone` est interdit dans un bloc `server {}`.
#
# Application par l'administrateur (sudo requis) :
#   sudo cp deploy/nginx/00-ecomschool-ratelimit.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Les directives `limit_req` correspondantes sont dans les confs de site
# (ecomschool.fr.conf, preprod.ecomschool.fr.conf). Elles deviennent
# effectives dès que cette zone existe ; sans elle nginx -t échouerait
# — déployer ce fichier AVANT ou EN MÊME TEMPS que les confs de site.

# API générale : 10 req/s par IP, rafale 20 tolérée.
limit_req_zone $binary_remote_addr zone=ecom_api:10m rate=10r/s;

# Authentification et endpoints publics sensibles (login, inscription,
# candidature, webhooks) : 2 req/s par IP, rafale 10.
limit_req_zone $binary_remote_addr zone=ecom_auth:10m rate=2r/s;

# Connexions simultanées par IP : anti-scraping grossier.
limit_conn_zone $binary_remote_addr zone=ecom_conn:10m;
