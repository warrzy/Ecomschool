# ECOM-SCHOOL — production
# Fichier : /etc/nginx/sites-available/ecomschool.fr.conf
# Activation : sudo ln -s /etc/nginx/sites-available/ecomschool.fr.conf \
#              /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# Puis TLS : sudo certbot --nginx -d ecomschool.fr -d www.ecomschool.fr
# Ne modifie aucune configuration existante (preprod, wendyam-finance, tme-machinery).

upstream ecomschool_prod {
    server 127.0.0.1:3002;
    keepalive 32;
}

# www → apex : redirection permanente.
server {
    listen 80;
    listen [::]:80;
    server_name www.ecomschool.fr;
    return 301 https://ecomschool.fr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name ecomschool.fr;

    # /api/cron : local uniquement, secret Bearer obligatoire.
    location /api/cron {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass         http://ecomschool_prod;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Certbot réécrira ce bloc pour la redirection HTTPS.
    location / {
        proxy_pass         http://ecomschool_prod;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        # PDF collectifs et exports : réponses potentiellement lourdes.
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }
}
